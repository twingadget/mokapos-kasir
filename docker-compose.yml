services:
  postgres:
    image: postgres:16-alpine
    container_name: moka_pos_bar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: moka_pos_bar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - moka_pos_bar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moka_pos_bar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moka_pos_bar_pgdata:
